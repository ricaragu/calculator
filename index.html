<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculadora">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; background: #000000;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #app-container {
      width: 100%; height: 100%; height: 100dvh;
      display: flex; flex-direction: column;
      justify-content: flex-end; position: relative;
    }
    .secret-hotspot {
      position: absolute; top: 0; width: 70px; height: 70px; z-index: 999;
    }
    #hotspot-top-left { left: 0; }
    #hotspot-top-right { right: 0; }

    /* LAYOUT BASE CALCULADORA */
    .calc-body {
      display: flex; flex-direction: column; justify-content: flex-end;
      width: 100%; max-width: 420px; margin: 0 auto;
      padding: 0 16px calc(14px + var(--safe-bottom)) 16px;
    }

    /* BARRA SUPERIOR SAMSUNG */
    .samsung-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px 6px 12px; color: #8e8e93;
    }
    .toolbar-left { display: flex; gap: 18px; }
    .tool-icon { width: 20px; height: 20px; fill: #8e8e93; cursor: pointer; }
    .theme-ios .samsung-toolbar, .theme-android .samsung-toolbar { display: none; }

    /* DISPLAY */
    .display-wrapper {
      width: 100%; display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-end;
      padding: 0 12px 14px 12px; min-height: 140px;
    }
    .formula-line {
      font-size: 44px; font-weight: 400; text-align: right;
      color: #ffffff; line-height: 1.15; width: 100%;
      white-space: nowrap; overflow: hidden;
      transition: font-size 0.15s ease;
    }
    .formula-line.promoted {
      animation: resultSlideUp 0.22s ease-out;
    }
    @keyframes resultSlideUp {
      from { transform: translateY(12px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .soft-preview-line {
      font-size: 30px; font-weight: 300; text-align: right;
      color: #7b7b80; min-height: 36px; margin-top: 4px;
      width: 100%; white-space: nowrap; overflow: hidden;
    }
    .theme-ios .soft-preview-line { display: none; }
    .theme-ios .formula-line { font-size: 76px; font-weight: 300; }

    /* TECLADO */
    .keypad-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; width: 100%;
    }
    .btn {
      aspect-ratio: 1 / 1; border-radius: 50%;
      border: none; outline: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 400;
      transition: transform 0.08s, filter 0.12s;
    }
    .btn:active { transform: scale(0.93); filter: brightness(125%); }

    /* ESTILO SAMSUNG ONE UI */
    .theme-samsung .btn-num { background: #171719; color: #ffffff; font-size: 30px; }
    .theme-samsung .btn-func { background: #171719; color: #ea4335; font-size: 26px; }
    .theme-samsung .btn-parens, .theme-samsung .btn-percent { color: #36bc7c; }
    .theme-samsung .btn-op { background: #171719; color: #36bc7c; font-size: 34px; }
    .theme-samsung .btn-op.active-op { background: #274334; color: #4ade80; }
    .theme-samsung .btn-equal { background: #36bc7c; color: #000000; font-size: 36px; font-weight: 600; }

    /* ESTILO iOS */
    .theme-ios { background: #000000; }
    .theme-ios .btn-num { background: #333333; color: #ffffff; }
    .theme-ios .btn-func { background: #a5a5a5; color: #000000; }
    .theme-ios .btn-op { background: #fe9e09; color: #ffffff; font-size: 38px; }
    .theme-ios .btn-op.active-op { background: #ffffff; color: #fe9e09; }
    .theme-ios .btn-equal { background: #fe9e09; color: #ffffff; }
    .theme-ios .btn-zero { grid-column: span 2; aspect-ratio: auto; border-radius: 40px; justify-content: flex-start; padding-left: 28px; }

    /* ESTILO GOOGLE PIXEL */
    .theme-android { background: #1e1f20; }
    .theme-android .btn { border-radius: 36px; height: 68px; aspect-ratio: auto; }
    .theme-android .btn-num { background: #2e3032; color: #e3e3e3; }
    .theme-android .btn-func { background: #3b3d40; color: #c4c7c5; }
    .theme-android .btn-op { background: #004a77; color: #c2e7ff; }
    .theme-android .btn-op.active-op { background: #c2e7ff; color: #004a77; }
    .theme-android .btn-equal { background: #a8c7fa; color: #042e5d; font-weight: bold; }

    /* MODAL SECRETO */
    #secret-menu {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
      z-index: 10000; padding: 20px;
      flex-direction: column; justify-content: center; align-items: center; color: #ffffff;
    }
    #secret-menu.show { display: flex; }
    .menu-card {
      background: #1c1c1e; border: 1px solid #333; border-radius: 18px;
      padding: 22px; width: 100%; max-width: 340px;
    }
    .menu-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 14px; }
    .theme-opt-btn {
      border: none; background: #2c2c2e; color: #8e8e93;
      padding: 6px 10px; font-size: 12px; font-weight: 600; border-radius: 7px; cursor: pointer;
    }
    .theme-opt-btn.active { background: #36bc7c; color: #000; }
    .badge { padding: 4px 8px; border-radius: 6px; font-family: monospace; background: #2c2c2e; color: #36bc7c; }
    .action-btn {
      width: 100%; padding: 11px; margin-top: 8px; border-radius: 10px;
      border: none; font-weight: 600; cursor: pointer; background: #36bc7c; color: #000;
    }
    .close-btn { background: transparent; color: #8e8e93; border: none; width: 100%; margin-top: 10px; cursor: pointer; }
    #magic-status-dot {
      position: absolute; bottom: 6px; left: 6px; width: 4px; height: 4px;
      border-radius: 50%; pointer-events: none;
    }
    #magic-status-dot.armed { background: #36bc7c; }
    #magic-status-dot.facedown { background: #30d158; }
  </style>
</head>
<body class="theme-samsung">
  <div id="app-container">
    <div id="hotspot-top-left" class="secret-hotspot" title="Triple tap: Menú Secreto"></div>
    <div id="hotspot-top-right" class="secret-hotspot" title="Triple tap: Cambiar Tema"></div>

    <div class="calc-body">
      <!-- Toolbar Samsung -->
      <div class="samsung-toolbar">
        <div class="toolbar-left">
          <svg class="tool-icon" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
          <svg class="tool-icon" viewBox="0 0 24 24"><path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H3V6h18v12zM5 8h2v3H5V8zm4 0h2v5H9V8zm4 0h2v3h-2V8zm4 0h2v5h-2V8z"/></svg>
        </div>
        <div class="toolbar-right">
          <svg class="tool-icon" id="btn-backspace" viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>
        </div>
      </div>

      <!-- Display -->
      <div class="display-wrapper" id="display-area">
        <div class="formula-line" id="formula-display">0</div>
        <div class="soft-preview-line" id="soft-preview"></div>
      </div>

      <!-- Keypad -->
      <div class="keypad-grid" id="keypad">
        <button type="button" class="btn btn-func" data-action="clear" id="btn-clear">C</button>
        <button type="button" class="btn btn-func btn-parens" data-action="parens">( )</button>
        <button type="button" class="btn btn-func btn-percent" data-action="percent">%</button>
        <button type="button" class="btn btn-op" data-action="divide" data-op="÷">÷</button>

        <button type="button" class="btn btn-num" data-num="7">7</button>
        <button type="button" class="btn btn-num" data-num="8">8</button>
        <button type="button" class="btn btn-num" data-num="9">9</button>
        <button type="button" class="btn btn-op" data-action="multiply" data-op="×">×</button>

        <button type="button" class="btn btn-num" data-num="4">4</button>
        <button type="button" class="btn btn-num" data-num="5">5</button>
        <button type="button" class="btn btn-num" data-num="6">6</button>
        <button type="button" class="btn btn-op" data-action="subtract" data-op="-">−</button>

        <button type="button" class="btn btn-num" data-num="1">1</button>
        <button type="button" class="btn btn-num" data-num="2">2</button>
        <button type="button" class="btn btn-num" data-num="3">3</button>
        <button type="button" class="btn btn-op" data-action="add" data-op="+">+</button>

        <button type="button" class="btn btn-num btn-zero" data-action="negate">±</button>
        <button type="button" class="btn btn-num" data-num="0">0</button>
        <button type="button" class="btn btn-num" data-action="decimal">,</button>
        <button type="button" class="btn btn-op btn-equal" data-action="equals" id="btn-equals">=</button>
      </div>
    </div>
    <div id="magic-status-dot"></div>
  </div>

  <!-- Menú Secreto -->
  <div id="secret-menu">
    <div class="menu-card">
      <div style="font-size:18px; font-weight:700; color:#36bc7c; margin-bottom:12px;">✨ Modo Mago</div>
      <div class="menu-row">
        <span>Diseño</span>
        <div>
          <button type="button" class="theme-opt-btn active" id="btn-th-samsung">Samsung</button>
          <button type="button" class="theme-opt-btn" id="btn-th-ios">iOS</button>
          <button type="button" class="theme-opt-btn" id="btn-th-android">Pixel</button>
        </div>
      </div>
      <div class="menu-row"><span>Giroscopio</span><span class="badge" id="gyro-val">0° / 0°</span></div>
      <div class="menu-row"><span>Boca Abajo</span><span class="badge" id="facedown-val">NO</span></div>
      <div class="menu-row"><span>Hora Actual (T)</span><span class="badge" id="target-val">--</span></div>
      <button type="button" class="action-btn" id="btn-sim-facedown">🔄 Simular Boca Abajo</button>
      <button type="button" class="close-btn" id="btn-close-secret">Cerrar</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      let audioCtx = null;
      function playClick(freq = 600) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.02);
        } catch (e) {}
      }

      function vibrate(ms = 15) {
        if ('vibrate' in navigator) try { navigator.vibrate(ms); } catch (e) {}
      }

      const state = {
        theme: 'samsung',
        expression: '0',
        currentOperand: '0',
        waitingNewOperand: false,
        activeOpElem: null,
        trickArmed: false,
        accumulatedProductA: 0,
        requiredDifferenceX: 0,
        targetT: 0,
        isFaceDown: false
      };

      const body = document.body;
      const formulaElem = document.getElementById('formula-display');
      const softPreviewElem = document.getElementById('soft-preview');
      const btnClear = document.getElementById('btn-clear');
      const secretMenu = document.getElementById('secret-menu');
      const gyroValElem = document.getElementById('gyro-val');
      const facedownValElem = document.getElementById('facedown-val');
      const targetValElem = document.getElementById('target-val');
      const statusDot = document.getElementById('magic-status-dot');

      function computeT() {
        const d = new Date();
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = String(d.getFullYear()).slice(-2);
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return parseInt(`${dd}${mm}${yy}${hh}${min}`, 10);
      }

      function formatDots(n) {
        if (!n && n !== 0) return '';
        const parts = String(n).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return parts.join(',');
      }

      function evaluatePreview() {
        if (state.trickArmed) {
          softPreviewElem.textContent = state.requiredDifferenceX ? formatDots(state.targetT) : '';
          return;
        }
        const expr = state.expression.trim();
        if (!/[×+\-−÷]/.test(expr) || /[×+\-−÷]$/.test(expr)) {
          softPreviewElem.textContent = '';
          return;
        }
        try {
          const sanitized = expr.replace(/×/g, '*').replace(/−/g, '-').replace(/÷/g, '/');
          const tokens = sanitized.match(/(\d+\.?\d*|[\+\-\*\/])/g);
          if (!tokens || tokens.length < 3) { softPreviewElem.textContent = ''; return; }
          let acc = parseFloat(tokens[0]);
          for (let i = 1; i < tokens.length; i += 2) {
            const op = tokens[i];
            const v = parseFloat(tokens[i + 1]);
            if (isNaN(v)) break;
            if (op === '+') acc += v;
            else if (op === '-') acc -= v;
            else if (op === '*') acc *= v;
            else if (op === '/') acc = v === 0 ? 0 : acc / v;
          }
          softPreviewElem.textContent = (!isNaN(acc) && isFinite(acc)) ? formatDots(acc) : '';
        } catch (e) { softPreviewElem.textContent = ''; }
      }

      function updateDisplay() {
        let str = state.expression;
        if (state.theme === 'ios') str = state.currentOperand.replace('.', ',');
        formulaElem.textContent = str;

        const len = str.length;
        if (state.theme === 'samsung') {
          formulaElem.style.fontSize = len > 14 ? '26px' : (len > 10 ? '34px' : (len > 7 ? '40px' : '44px'));
        } else if (state.theme === 'ios') {
          formulaElem.style.fontSize = len > 9 ? '38px' : (len > 7 ? '48px' : (len > 5 ? '62px' : '76px'));
        } else {
          formulaElem.style.fontSize = len > 12 ? '34px' : (len > 8 ? '44px' : '56px');
        }

        if (state.theme !== 'ios') evaluatePreview();
        btnClear.textContent = (state.expression !== '0' && state.expression !== '') ? 'C' : (state.theme === 'samsung' ? 'C' : 'AC');
        statusDot.className = state.isFaceDown ? 'facedown' : (state.trickArmed ? 'armed' : '');
      }

      function clearActiveOp() {
        if (state.activeOpElem) { state.activeOpElem.classList.remove('active-op'); state.activeOpElem = null; }
      }

      function inputDigit(d) {
        if (state.waitingNewOperand) {
          state.currentOperand = d;
          state.expression += ' ' + d;
          state.waitingNewOperand = false;
        } else {
          if (state.expression === '0') { state.expression = d; state.currentOperand = d; }
          else { state.expression += d; state.currentOperand += d; }
        }
        clearActiveOp();
        updateDisplay();
      }

      function inputDecimal() {
        if (state.waitingNewOperand) {
          state.currentOperand = '0.'; state.expression += ' 0.'; state.waitingNewOperand = false;
        } else if (!state.currentOperand.includes('.')) {
          state.currentOperand += '.'; state.expression += ',';
        }
        clearActiveOp();
        updateDisplay();
      }

      function inputBackspace() {
        if (state.expression.length <= 1) {
          state.expression = '0'; state.currentOperand = '0';
        } else {
          state.expression = state.expression.trimEnd().slice(0, -1).trimEnd() || '0';
        }
        updateDisplay();
      }

      function performOp(action, btn) {
        let sym = action === 'add' ? '+' : (action === 'subtract' ? '−' : (action === 'divide' ? '÷' : '×'));
        if (/[×+\-−÷]$/.test(state.expression.trim())) {
          state.expression = state.expression.trim().slice(0, -1) + sym;
          clearActiveOp();
          if (btn) { btn.classList.add('active-op'); state.activeOpElem = btn; }
          updateDisplay();
          return;
        }

        if (action === 'add') {
          let a = softPreviewElem.textContent !== '' ? parseFloat(softPreviewElem.textContent.replace(/\./g, '').replace(',', '.')) : parseFloat(state.currentOperand);
          state.accumulatedProductA = a;
          state.trickArmed = true;
          state.expression += ' +';
          state.currentOperand = '';
          state.waitingNewOperand = true;
          clearActiveOp();
          if (btn) { btn.classList.add('active-op'); state.activeOpElem = btn; }
          updateDisplay();
          return;
        }

        state.expression += ' ' + sym;
        state.currentOperand = '';
        state.waitingNewOperand = true;
        clearActiveOp();
        if (btn) { btn.classList.add('active-op'); state.activeOpElem = btn; }
        updateDisplay();
      }

      function handleEquals() {
        if (state.trickArmed) {
          const t = computeT();
          state.trickArmed = false;
          formulaElem.classList.remove('promoted');
          void formulaElem.offsetWidth;
          formulaElem.classList.add('promoted');
          state.expression = String(t);
          state.currentOperand = String(t);
          softPreviewElem.textContent = '';
          clearActiveOp();
          updateDisplay();
          return;
        }

        if (softPreviewElem.textContent !== '') {
          const res = softPreviewElem.textContent;
          formulaElem.classList.remove('promoted');
          void formulaElem.offsetWidth;
          formulaElem.classList.add('promoted');
          state.expression = res;
          state.currentOperand = res.replace(/\./g, '');
          softPreviewElem.textContent = '';
          state.waitingNewOperand = true;
          clearActiveOp();
          updateDisplay();
        }
      }

      function clearAll() {
        state.expression = '0'; state.currentOperand = '0';
        state.waitingNewOperand = false; state.trickArmed = false;
        softPreviewElem.textContent = ''; clearActiveOp();
        updateDisplay();
      }

      /* Boca Abajo */
      function onFaceDown() {
        if (state.isFaceDown) return;
        state.isFaceDown = true;
        facedownValElem.textContent = 'SÍ';
        if (state.trickArmed) {
          state.targetT = computeT();
          state.requiredDifferenceX = state.targetT - state.accumulatedProductA;
          targetValElem.textContent = state.targetT;
          state.currentOperand = String(state.requiredDifferenceX);
          state.expression = `${formatDots(state.accumulatedProductA)} + ${state.requiredDifferenceX}`;
          state.waitingNewOperand = false;
        }
        updateDisplay();
      }

      function onFaceUp() {
        if (!state.isFaceDown) return;
        state.isFaceDown = false;
        facedownValElem.textContent = 'NO';
        if (state.trickArmed) { clearActiveOp(); updateDisplay(); }
      }

      function blindTouch(e) {
        if (!state.isFaceDown) return;
        e.preventDefault(); e.stopPropagation();
        vibrate(20); playClick(550);
        if (state.trickArmed) {
          state.targetT = computeT();
          state.requiredDifferenceX = state.targetT - state.accumulatedProductA;
          state.currentOperand = String(state.requiredDifferenceX);
          state.expression = `${formatDots(state.accumulatedProductA)} + ${state.requiredDifferenceX}`;
        }
      }

      let orientationAttached = false;
      function handleOrientation(e) {
        if (e.beta === null) return;
        gyroValElem.textContent = `${Math.round(e.beta)}° / ${Math.round(e.gamma)}°`;
        if (Math.abs(e.beta) > 135 || Math.abs(e.gamma) > 135) onFaceDown();
        else if (Math.abs(e.beta) < 80 && Math.abs(e.gamma) < 60) onFaceUp();
      }

      function initSensors() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(r => {
            if (r === 'granted' && !orientationAttached) {
              window.addEventListener('deviceorientation', handleOrientation, true);
              orientationAttached = true;
            }
          }).catch(() => {});
        } else if (!orientationAttached) {
          window.addEventListener('deviceorientation', handleOrientation, true);
          orientationAttached = true;
        }
      }

      function setTheme(t) {
        state.theme = t;
        body.className = `theme-${t}`;
        document.getElementById('btn-th-samsung').classList.toggle('active', t === 'samsung');
        document.getElementById('btn-th-ios').classList.toggle('active', t === 'ios');
        document.getElementById('btn-th-android').classList.toggle('active', t === 'android');
        updateDisplay();
      }

      /* Eventos */
      document.getElementById('keypad').addEventListener('click', function (e) {
        if (state.isFaceDown) { blindTouch(e); return; }
        const btn = e.target.closest('.btn');
        if (!btn) return;
        playClick(650); vibrate(12);
        if (btn.hasAttribute('data-num')) { inputDigit(btn.getAttribute('data-num')); return; }
        const act = btn.getAttribute('data-action');
        if (act === 'clear') clearAll();
        else if (act === 'decimal') inputDecimal();
        else if (act === 'equals') handleEquals();
        else if (act === 'add' || act === 'subtract' || act === 'multiply' || act === 'divide') performOp(act, btn);
      });

      document.getElementById('btn-backspace').addEventListener('click', () => { playClick(500); inputBackspace(); });

      window.addEventListener('touchstart', (e) => {
        if (!orientationAttached) initSensors();
        if (state.isFaceDown) blindTouch(e);
      }, { passive: false });

      window.addEventListener('mousedown', (e) => {
        if (!orientationAttached) initSensors();
        if (state.isFaceDown) blindTouch(e);
      });

      let lTaps = 0, lTimer = null;
      document.getElementById('hotspot-top-left').addEventListener('click', (e) => {
        e.stopPropagation(); lTaps++; clearTimeout(lTimer);
        if (lTaps >= 3) {
          lTaps = 0; targetValElem.textContent = computeT(); secretMenu.classList.add('show');
        } else lTimer = setTimeout(() => { lTaps = 0; }, 400);
      });

      let rTaps = 0, rTimer = null;
      document.getElementById('hotspot-top-right').addEventListener('click', (e) => {
        e.stopPropagation(); rTaps++; clearTimeout(rTimer);
        if (rTaps >= 3) {
          rTaps = 0;
          setTheme(state.theme === 'samsung' ? 'ios' : (state.theme === 'ios' ? 'android' : 'samsung'));
        } else rTimer = setTimeout(() => { rTaps = 0; }, 400);
      });

      document.getElementById('btn-th-samsung').addEventListener('click', () => setTheme('samsung'));
      document.getElementById('btn-th-ios').addEventListener('click', () => setTheme('ios'));
      document.getElementById('btn-th-android').addEventListener('click', () => setTheme('android'));
      document.getElementById('btn-close-secret').addEventListener('click', () => secretMenu.classList.remove('show'));
      document.getElementById('btn-sim-facedown').addEventListener('click', () => {
        if (state.isFaceDown) onFaceUp(); else onFaceDown();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F' || e.key === 'd' || e.key === 'D') {
          if (state.isFaceDown) onFaceUp(); else onFaceDown();
        }
      });

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      setTheme('samsung');
    })();
  </script>
</body>
</html>
